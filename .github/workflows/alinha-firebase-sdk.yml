name: Alinhar SDK Firebase
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alinhar versões Firebase
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 sed -i 's#firebasejs/12\.1\.0#firebasejs/10.8.0#g'
      - name: Commitar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet && exit 0
          git commit -m 'Alinhar SDK Firebase com painel original'
          git push
