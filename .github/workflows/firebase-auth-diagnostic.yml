name: Firebase Auth diagnostic
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Firebase Auth API key
        env:
          FIREBASE_API_KEY: AIzaSyB1E9oQsIwYO2-r4W5-uQK4ax92OmxISOI
        run: |
          set +e
          response=$(curl -sS -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data '{"email":"diagnostic-nonexistent@example.invalid","password":"diagnostic-invalid-password","returnSecureToken":true}')
          status=$?
          echo "curl_exit=$status"
          echo "$response" | python -c 'import json,sys; d=json.load(sys.stdin); e=d.get("error",{}); print("error_status="+str(e.get("status"))); print("error_message="+str(e.get("message")))'
          exit 0
